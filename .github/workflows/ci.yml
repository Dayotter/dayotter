name: CI

# Lint, type-check, and test on every push to main and every PR. The full
# production build is exercised by the Docker images in the deploy pipeline.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Hard gate: the tree is clean (issue #166 cleared). Fails the build on any
      # Biome error; the few "warn"-level rules stay non-blocking.
      - name: Lint + format (Biome, read-only)
        run: pnpm exec biome ci .

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Exercise the real production build on every PR. Previously the Next.js build
  # ran only inside the Docker deploy pipeline, so a build-only break (e.g. an
  # empty NEXT_PUBLIC_APP_URL making `new URL("")` throw, #261) slipped past CI
  # and failed at deploy time. This catches it on the PR instead. Runs with no
  # app secrets - a clean build must not depend on any, exactly as Docker builds.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
