name: Publish container images

# Build and push versioned web + worker images to the GitHub Container Registry
# on every `vX.Y.Z` tag, so a self-hoster can pin and scan a published image
# instead of compiling the app on the box that holds their calendar data (#291).
# Also runnable by hand (workflow_dispatch) to backfill or re-push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/dayotter-web
          - app: worker
            dockerfile: apps/worker/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/dayotter-worker
    name: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation - slower, but a release runs on tags only.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z (exact), vX.Y (track patches), and `latest` for the newest stable
      # (not for -rc/-beta prereleases). metadata-action lowercases the image name.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          # Build context is the repo root (the Dockerfiles expect it).
          # NEXT_PUBLIC_* stay at their empty build-arg defaults: a published image
          # is generic, so client-inlined values (analytics ids, publishable keys)
          # come from the operator's own build, while all server config is runtime env.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
